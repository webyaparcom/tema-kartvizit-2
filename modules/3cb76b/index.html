<header class="modulex-ust-buyuk-yazi{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-buyuk-yazi-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</header>

<style>
  /* ust-buyuk-yazi — Marka adı başlığın kendisi: logo kutusu değil, sayfa genişliğinde tipografik bir manşet (kişisel marka, stüdyo, moda dili). */
  .modulex-ust-buyuk-yazi { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-buyuk-yazi *, .modulex-ust-buyuk-yazi *::before, .modulex-ust-buyuk-yazi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-buyuk-yazi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-buyuk-yazi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-buyuk-yazi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-buyuk-yazi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-buyuk-yazi img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-buyuk-yazi) img { height: auto; }
  .modulex-ust-buyuk-yazi [hidden] { display: none !important; }
  .modulex-ust-buyuk-yazi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-buyuk-yazi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-buyuk-yazi-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-buyuk-yazi-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-buyuk-yazi--bassiz .modulex-ust-buyuk-yazi-bas { display: none; }
  .modulex-ust-buyuk-yazi-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-buyuk-yazi-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-buyuk-yazi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-buyuk-yazi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-buyuk-yazi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-buyuk-yazi-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-buyuk-yazi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-buyuk-yazi-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-buyuk-yazi-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-buyuk-yazi { position: relative; z-index: 900; }
  .modulex-ust-buyuk-yazi-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-buyuk-yazi-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-buyuk-yazi-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-buyuk-yazi-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-buyuk-yazi-oge:hover, .modulex-ust-buyuk-yazi-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-buyuk-yazi-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-buyuk-yazi-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-buyuk-yazi-cta .material-symbols-outlined, .modulex-ust-buyuk-yazi-tel .material-symbols-outlined, .modulex-ust-buyuk-yazi-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-buyuk-yazi-tel, .modulex-ust-buyuk-yazi-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-buyuk-yazi-tel:hover, .modulex-ust-buyuk-yazi-posta:hover { color: --accentInk--; }
  .modulex-ust-buyuk-yazi-dil:empty { display: none; }
  .modulex-ust-buyuk-yazi-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-buyuk-yazi-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-buyuk-yazi-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-buyuk-yazi--acik .modulex-ust-buyuk-yazi-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-buyuk-yazi--acik .modulex-ust-buyuk-yazi-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-buyuk-yazi--acik .modulex-ust-buyuk-yazi-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-buyuk-yazi-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-buyuk-yazi-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-buyuk-yazi-sol 0.3s ease both; }
  @keyframes modulex-ust-buyuk-yazi-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-buyuk-yazi-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-buyuk-yazi--js .modulex-ust-buyuk-yazi-nav, .modulex-ust-buyuk-yazi--js .modulex-ust-buyuk-yazi-genis { display: none; }
    .modulex-ust-buyuk-yazi--js .modulex-ust-buyuk-yazi-ac { display: inline-flex; }
    .modulex-ust-buyuk-yazi-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-buyuk-yazi-in 0.3s ease both; }
    .modulex-ust-buyuk-yazi-pliste { display: grid; }
    .modulex-ust-buyuk-yazi-pliste .modulex-ust-buyuk-yazi-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-buyuk-yazi-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-buyuk-yazi-panel { display: none !important; }
  }
  @keyframes modulex-ust-buyuk-yazi-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-buyuk-yazi-ince { display: flex; align-items: center; justify-content: space-between; gap: 12px 28px; padding-block: 12px; border-block-end: 1px solid --cizgi--; }
  .modulex-ust-buyuk-yazi-ince > .modulex-ust-buyuk-yazi-logo:not(:has(img)) { display: none; }
  .modulex-ust-buyuk-yazi-ince > .modulex-ust-buyuk-yazi-logo img { max-height: 30px; }
  .modulex-ust-buyuk-yazi-kliste { display: flex; flex-wrap: wrap; gap: 0 22px; }
  .modulex-ust-buyuk-yazi-kliste .modulex-ust-buyuk-yazi-oge { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
  .modulex-ust-buyuk-yazi-kliste .modulex-ust-buyuk-yazi-oge[aria-current="page"]::before { content: ""; width: 8px; height: 8px; margin-inline-end: 8px; background-color: --accent--; }
  .modulex-ust-buyuk-yazi-ince > .modulex-ust-buyuk-yazi-son { display: flex; align-items: center; gap: 12px; margin-inline-start: auto; }
  .modulex-ust-buyuk-yazi-genis { display: flex; align-items: center; gap: 14px; }
  .modulex-ust-buyuk-yazi-dev { display: block; padding-block: clamp(14px, 2.4vw, 28px) 0; color: inherit; text-decoration: none; }
  .modulex-ust-buyuk-yazi-dev-yazi { display: block; font-family: var(--mx-font-heading, inherit); font-size: clamp(2.6rem, 10.5vw, 10rem); font-weight: 900; letter-spacing: -0.055em; line-height: 0.98; overflow-wrap: anywhere; text-transform: uppercase; transition: letter-spacing 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.3s ease; }
  .modulex-ust-buyuk-yazi-dev:hover .modulex-ust-buyuk-yazi-dev-yazi { color: --accentInk--; letter-spacing: -0.035em; }
  .modulex-ust-buyuk-yazi-dev::after { content: ""; display: block; height: 6px; margin-block-start: clamp(10px, 1.4vw, 18px); background-color: --text--; transition: transform 0.5s ease, background-color 0.3s ease; }
  .modulex-ust-buyuk-yazi-dev:hover::after { background-color: --accent--; transform: scaleX(0.97); }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-buyuk-yazi-dev-yazi { letter-spacing: 0; line-height: 1.25; text-transform: none; }
  @media (max-width: 1024px) {
    .modulex-ust-buyuk-yazi:not(.modulex-ust-buyuk-yazi--js) .modulex-ust-buyuk-yazi-ince { flex-wrap: wrap; }
  }
  @media (max-width: 768px) {
    .modulex-ust-buyuk-yazi-dev-yazi { font-size: clamp(2.2rem, 13vw, 4.4rem); }
    .modulex-ust-buyuk-yazi-dev::after { height: 4px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-buyuk-yazi :is(.modulex-ust-buyuk-yazi-baslik, .modulex-ust-buyuk-yazi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-buyuk-yazi-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-buyuk-yazi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-buyuk-yazi *, .modulex-ust-buyuk-yazi *::before, .modulex-ust-buyuk-yazi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-buyuk-yazi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
    });
  })();
</script>
