        const dl = document.documentElement.lang || undefined;
        const iso = (t) => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
        const isoGun = (t) => ((t.getDay() + 6) % 7) + 1;

          const d = f.dataset;
          s.classList.add(P + "--rjs");
          const gunler = String(d.gunler || "1,2,3,4,5,6,7").split(",").map(Number);
          const kapali = String(d.kapali || "").split(",").filter(Boolean);
          const acikMi = (t) => gunler.includes(isoGun(t)) && !kapali.includes(iso(t));
          const bugun = new Date();
          bugun.setHours(0, 0, 0, 0);
          const ilkGun = new Date(bugun);
          ilkGun.setDate(ilkGun.getDate() + (Number(d.onGun) || 0));
          const sonGun = new Date(bugun);
          sonGun.setDate(sonGun.getDate() + (Number(d.azamiGun) || 60));
          const durum = f.querySelector("[role=status]");
          const yaz = (m, hata) => { if (durum) { durum.textContent = m || ""; durum.classList.toggle(P + "-durum--hata", !!hata); } };
          const al = (ad) => { const e = f.elements.namedItem(ad); return e && "value" in e ? String(e.value).trim() : ""; };
          let t0 = Date.now();
          /* tarih: sınır + kapalı gün */
          const tarih = f.querySelector("input[type=date]");
          const kontrol = () => { if (!tarih) return; const t = coz(tarih.value); tarih.setCustomValidity(t && !acikMi(t) ? d.kapaliMesaj || "" : ""); };
          if (tarih) {
            tarih.min = iso(ilkGun);
            tarih.max = iso(sonGun);
            tarih.addEventListener("change", kontrol);
            tarih.addEventListener("input", kontrol);
          }
          /* gün şeridi: açık günlerden N düğme (yerel dilde gün adı); varsa yerel tarih alanının yerine geçer */
          const serit = f.querySelector("[data-gun-serit]");
          if (serit && tarih) {
            const adet = Number(serit.dataset.gunSerit) || 14;
            const fa = bicim({ weekday: "short" });
            const fg = bicim({ day: "numeric" });
            const fy = bicim({ month: "short" });
            const t = new Date(ilkGun);
            let n = 0;
            for (let g = 0; n < adet && t <= sonGun && g < 400; g++) {
              if (acikMi(t)) {
                const l = document.createElement("label");
                l.className = P + "-gun";
                const r = document.createElement("input");
                r.type = "radio";
                r.name = "date";
                r.value = iso(t);
                r.className = P + "-radyo";
                r.dataset.tarih = "1";
                r.dataset.etiket = tarih.dataset.etiket || "";
                if (!n) r.required = true;
                l.append(r);
                [[fa, "gad"], [fg, "gno"], [fy, "gay"]].forEach(([b, k]) => { const sp = document.createElement("span"); sp.className = P + "-" + k; sp.textContent = b ? b.format(t) : iso(t); l.append(sp); });
                serit.append(l);
                n++;
              }
              t.setDate(t.getDate() + 1);
            }
            if (n) {
              const kap = f.querySelector("[data-gun-kap]");
              const yerel = f.querySelector("[data-tarih-alan]");
              if (kap) kap.hidden = false;
              if (yerel) yerel.hidden = true;
              tarih.disabled = true;
            }
          }
          /* kişi sayacı */
          f.querySelectorAll("[data-arti], [data-eksi]").forEach((b) => b.addEventListener("click", () => {
            const e = f.querySelector("#" + (b.dataset.arti || b.dataset.eksi));
            if (!e) return;
            if (b.dataset.arti) e.stepUp(); else e.stepDown();
            e.dispatchEvent(new Event("input", { bubbles: true }));
          }));
          /* satırlar: alan etiketi (data-etiket) + okunur değer; seçimde seçenek yazısı, tarihte yerel uzun tarih */
          const satirlar = () => {
            const out = [];
            const gor = new Set();
            [...f.elements].forEach((e) => {
              if (!e.name || e.disabled || gor.has(e.name) || ["website", "kvkk", "fb-kanal"].includes(e.name) || e.type === "submit" || e.type === "button") return;
              let v = "";
              if (e.type === "radio") {
                const c = [...f.elements].find((x) => x.name === e.name && x.checked && !x.disabled);
                if (!c) return;
                v = c.dataset.tarih ? tarihYaz(c.value) : c.dataset.metin || c.value;
              } else if (e.type === "checkbox") {
                if (!e.checked) return;
                v = e.dataset.metin || e.value;
              } else if (e.tagName === "SELECT") {
                if (!e.value) return;
                v = e.options[e.selectedIndex].text.trim();
              } else if (e.type === "date") v = tarihYaz(e.value);
              else v = String(e.value).trim();
              gor.add(e.name);
              if (v) out.push({ ad: e.name, et: e.dataset.etiket || e.name, v });
            });
            return out;
          };
          /* canlı özet: [data-ozet] listeleri (form dışında da olabilir, modül içinde) */
          const ozet = () => {
            const L = satirlar().filter((x) => x.ad !== "message");
            s.querySelectorAll("[data-ozet]").forEach((o) => {
              o.replaceChildren(...L.map((x) => { const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = x.et; const sp = document.createElement("span"); sp.textContent = x.v; li.append(b, sp); return li; }));
            });
            s.classList.toggle(P + "--ozetli", L.length > 0);
          };
          f.addEventListener("input", ozet);
          f.addEventListener("change", ozet);
          /* adım sihirbazı: [data-adim] alan grupları, [data-ileri] / [data-geri], [data-adim-isaret] göstergeleri, --adim (0…1) */
          const adimlar = [...f.querySelectorAll("[data-adim]")];
          const isaret = [...s.querySelectorAll("[data-adim-isaret]")];
          let ai = 0;
          const goster = (n, odak) => {
            ai = n;
            adimlar.forEach((a, j) => { a.hidden = j !== n; });
            isaret.forEach((x, j) => { if (j === n) x.setAttribute("aria-current", "step"); else x.removeAttribute("aria-current"); x.classList.toggle(P + "--tamam", j < n); });
            s.style.setProperty("--adim", String(adimlar.length > 1 ? n / (adimlar.length - 1) : 1));
            f.querySelectorAll("[data-geri]").forEach((b) => { b.hidden = n === 0; });
            f.querySelectorAll("[data-ileri]").forEach((b) => { b.hidden = n === adimlar.length - 1; });
            f.querySelectorAll("[data-son]").forEach((b) => { b.hidden = n !== adimlar.length - 1; });
            if (odak) { const g = adimlar[n].querySelector("input:not([type=hidden]):not(:disabled), select, textarea"); if (g) g.focus(); }
          };
          if (adimlar.length > 1) {
            f.querySelectorAll("[data-ileri]").forEach((b) => b.addEventListener("click", () => {
              const kotu = [...adimlar[ai].querySelectorAll("input, select, textarea")].find((e) => e.willValidate && !e.checkValidity());
              if (kotu) { kotu.reportValidity(); return; }
              if (ai < adimlar.length - 1) goster(ai + 1, true);
            }));
            f.querySelectorAll("[data-geri]").forEach((b) => b.addEventListener("click", () => { if (ai > 0) goster(ai - 1, true); }));
            goster(0);
          }
          const ics = (metin) => {
            const t = coz(al("date"));
            if (!t) return;
            const sa = /^(\d{1,2}):(\d{2})$/.exec(al("time"));
            const sec = f.querySelector("select[name=service]");
            const r = [...f.elements].find((x) => x.name === "service" && x.checked);
            const dk = Number((r && r.dataset.sure) || (sec && sec.selectedIndex > 0 && sec.options[sec.selectedIndex].dataset.sure) || d.sure) || 30;
            const z = (x) => `${iso(x).replace(/-/g, "")}T${String(x.getHours()).padStart(2, "0")}${String(x.getMinutes()).padStart(2, "0")}00`;
            const kac = (x) => String(x).replace(/\\/g, "\\\\").replace(/[,;]/g, (m) => "\\" + m).replace(/\r?\n/g, "\\n");
            let bas = `DTSTART;VALUE=DATE:${iso(t).replace(/-/g, "")}`;
            let bit = "";
            if (sa) {
              t.setHours(+sa[1], +sa[2]);
              bas = `DTSTART:${z(t)}`;
              bit = `DTEND:${z(new Date(t.getTime() + dk * 60000))}`;
            }
            const satir = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//webmaker//randevu//", "BEGIN:VEVENT", `UID:${Date.now()}-${Math.random().toString(36).slice(2)}`,
              `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "")}`, bas, bit, `SUMMARY:${kac(d.konu || document.title)}`, `DESCRIPTION:${kac(metin)}`,
              d.yer ? `LOCATION:${kac(d.yer)}` : "", "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([satir], { type: "text/calendar" }));
            a.download = "randevu.ics";
            document.body.append(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 4000);
          };
          f.addEventListener("submit", (e) => {
            e.preventDefault();
            if (!f.checkValidity()) {
              const k = [...f.elements].find((x) => x.willValidate && !x.checkValidity());
              if (k && adimlar.length > 1) { const j = adimlar.findIndex((a) => a.contains(k)); if (j > -1 && j !== ai) goster(j); }
              f.reportValidity();
              return;
            }
            if (al("website")) return;
            const L = satirlar();
            const metin = (d.konu ? [d.konu, ""] : []).concat(L.map((x) => `${x.et}: ${x.v}`)).join("\n");
            const kanal = [...f.elements].find((x) => x.name === "fb-kanal" && x.checked);
            const g = kanal ? kanal.value : d.gonderim;
            const hizmet = (L.find((x) => x.ad === "service") || {}).v || "";
            if (d.action) {
              const b = f.querySelector("[type=submit]");
              if (b) b.disabled = true;
              const yuk = { name: al("name"), email: al("email"), phone: al("phone"), topic: hizmet, message: metin, date: al("date"), time: al("time"), guests: al("guests"),
                kvkk: true, lang: document.documentElement.lang || "", page: location.pathname, website: al("website"), t: Date.now() - t0 };
              fetch(d.action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(yuk) })
                .then((r) => r.json().catch(() => ({})).then((j) => r.ok && j && j.ok !== false))
                .then((ok) => { if (b) b.disabled = false; yaz(ok ? d.ok : d.hata, !ok); if (ok) { f.reset(); t0 = Date.now(); ozet(); } })
                .catch(() => { if (b) b.disabled = false; yaz(d.hata, true); });
              return;
            }
            if (g === "whatsapp" && d.wa) window.open(`https://wa.me/${d.wa}?text=${encodeURIComponent(metin)}`, "_blank", "noopener");
            else if (g === "ics") ics(metin);
            else if (d.eposta) location.href = `mailto:${d.eposta}?subject=${encodeURIComponent(d.konu || "")}&body=${encodeURIComponent(metin.replace(/\n/g, "\r\n"))}`;
            else if (d.wa) window.open(`https://wa.me/${d.wa}?text=${encodeURIComponent(metin)}`, "_blank", "noopener");
            yaz(d.ok, false);
          });
          ozet();
        });
      };
    const gorusme = (s, P) => {
        const f = s.querySelector("form[data-fb-randevu]");
        if (!f) return;
        const notlar = [...s.querySelectorAll("[data-bnot]")];
        const bicim = () => {
          const r = [...f.elements].find((e) => e.name === "format" && e.checked);
          notlar.forEach((n) => { n.hidden = !r || n.dataset.bnot !== r.value; });
        };
        const k = s.querySelector("[data-sd]");
        const cikti = s.querySelector("[data-sd-cikti]");
        const kap = s.querySelector("[data-sd-kap]");
        const dl = document.documentElement.lang || undefined;
        let yerel = "";
        try { yerel = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (x) { yerel = ""; }
        const ofs = (tz, t) => {
          try {
            const p = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric" }).formatToParts(t);
            const g = (n) => Number((p.find((x) => x.type === n) || {}).value);
            return Math.round((Date.UTC(g("year"), g("month") - 1, g("day"), g("hour") % 24, g("minute")) - t.getTime()) / 60000);
          } catch (x) { return null; }
        };
        const saat = () => {
          if (!k || !cikti || !kap) return;
          const r = [...f.elements].find((e) => e.name === "time" && e.checked);
          const m = r ? /^(\d{1,2}):(\d{2})$/.exec(r.value) : null;
          if (!m) { kap.hidden = true; return; }
          const dv = f.elements.namedItem("date");
          const tv = /^(\d{4})-(\d{2})-(\d{2})$/.exec((dv && dv.value) || "");
          const b = new Date();
          const duvar = Date.UTC(tv ? +tv[1] : b.getFullYear(), tv ? +tv[2] - 1 : b.getMonth(), tv ? +tv[3] : b.getDate(), +m[1], +m[2]);
          const o1 = ofs(k.dataset.sd, new Date(duvar));
          if (o1 === null) { kap.hidden = true; return; }
          const an = new Date(duvar - o1 * 60000);
          let yazi = "";
          try { yazi = new Intl.DateTimeFormat(dl, { hour: "2-digit", minute: "2-digit", timeZoneName: "short" }).format(an); } catch (x) { yazi = an.toISOString().slice(11, 16); }
          const bd = document.createElement("bdi");
          bd.dir = "ltr";
          bd.textContent = yazi;
          cikti.replaceChildren(bd);
          kap.hidden = false;
          s.classList.toggle(P + "--farkli", !!yerel && ofs(yerel, an) !== o1);
        };
        f.addEventListener("change", () => { bicim(); saat(); });
        f.addEventListener("reset", () => setTimeout(() => { bicim(); saat(); }));
        bicim();
        saat();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      randevu(s, P, az);
      gorusme(s, P, az);
    });
  })();
</script>
