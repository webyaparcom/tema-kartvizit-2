  .modulex-alt-zarf-zf-mektup { position: relative; z-index: 1; display: grid; gap: 14px; margin-inline: 7%; padding: 24px 24px 88px; border-radius: 6px; background: --kartBg--; box-shadow: 0 12px 30px -22px color-mix(in srgb, --text-- 55%, transparent); transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-alt-zarf-zf-zarf:is(:hover, :focus-within) .modulex-alt-zarf-zf-mektup { transform: translateY(-16px); }

  .modulex-alt-zarf-zf-satir { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; padding-block: 10px; border-block-end: 1px dashed --cizgi--; }

  .modulex-alt-zarf-zf-kopya .material-symbols-outlined { font-size: 16px; }

  .modulex-alt-zarf-zf-kopya.modulex-alt-zarf--kopyalandi { border-color: --accent--; background-color: --accent--; color: --accentText--; }

  .modulex-alt-zarf-zf-zarf:hover .modulex-alt-zarf-zf-muhur { transform: rotate(-20deg) scale(1.08); }

  .modulex-alt-zarf-zf-dip .modulex-alt-zarf-telif { margin-inline-end: auto; }

  @media (max-width: 1024px) {

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-zarf :is(.modulex-alt-zarf-baslik, .modulex-alt-zarf-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-alt-zarf-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-alt-zarf { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-alt-zarf *, .modulex-alt-zarf *::before, .modulex-alt-zarf *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-alt-zarf";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const kopyala = (s, P) => {
        if (!navigator.clipboard || !navigator.clipboard.writeText) return;
        s.classList.add(P + "--kjs");
        s.querySelectorAll("[data-kopyala]").forEach((b) => {
          const yazi = b.querySelector("." + P + "-kyazi");
          const ilk = yazi ? yazi.textContent : "";
          b.addEventListener("click", () => {
            const bitti = () => {
              b.classList.add(P + "--kopyalandi");
              if (yazi) yazi.textContent = b.dataset.tamam || ilk;
              setTimeout(() => { b.classList.remove(P + "--kopyalandi"); if (yazi) yazi.textContent = ilk; }, 2000);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(b.dataset.kopyala).then(bitti, () => {});
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      kopyala(s, P, az);
    });
  })();
</script>
